name: CI

on:
  pull_request:
  push:
    branches: main

env:
  CI: true
  HUSKY: 0

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Detection (GitLeaks)
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run GitLeaks secret scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: Python & Fish Tests
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew install fish jq fd
          curl -LsSf https://astral.sh/uv/install.sh | sh

      # The suites that read skills, agents and the registries skip without a catalog.
      # CI fetches the commit pinned in the ai role's defaults rather than main, so a
      # catalog change cannot turn this repository red until a PR bumps the pin.
      - name: Clone the agent catalog
        run: |
          pin=$(uv run --no-project --with pyyaml python -c '
          import yaml
          catalog = yaml.safe_load(open("roles/ai/defaults/main.yml"))["AGENT_CATALOG"]
          print(catalog["repository"], catalog["commit"])
          ')
          read -r repository commit <<< "$pin"
          git init --quiet "$RUNNER_TEMP/agent-catalog"
          git -C "$RUNNER_TEMP/agent-catalog" fetch --depth 1 "$repository" "$commit"
          git -C "$RUNNER_TEMP/agent-catalog" checkout --quiet --detach FETCH_HEAD

      # No vault password needed: these tests read registries and drive the fish
      # functions against a throwaway HOME, never the playbook.
      #
      # The roots come from pytest.ini, so this covers claude-kit, the registries, the
      # skill scripts, the git hook and the suite layout itself. It once named a single
      # path and reported success while four suites were not being collected at all.
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # The committed harness renders name the checkout they are linked from, not this clone.
          HARNESS_RENDER_ROOT: ~/Developer/dotfiles/roles/ai/files/harness
          AGENT_CATALOG: ${{ runner.temp }}/agent-catalog
        run: make test

  static-lint:
    name: Markdown, Python, Shell & Fish Lint
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # fish comes from brew rather than a distro package so fish_indent formats like the local one.
      - name: Install dependencies
        run: |
          brew install fish
          curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Run static linters
        run: make lint-static

  lint:
    name: Ansible Lint & Syntax Check
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          brew install python@3.13
          "$(brew --prefix python@3.13)/bin/python3.13" -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/pip" install ansible-lint
          echo "$RUNNER_TEMP/lint-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/lint-venv/bin/ansible-galaxy" collection install -r requirements.yml

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run syntax check (personal profile)
        run: make syntax PROFILE=personal

      - name: Run syntax check (work profile)
        run: make syntax PROFILE=work
