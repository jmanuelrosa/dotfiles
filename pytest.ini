[pytest]
# Makes `dotkit` importable everywhere without a root conftest.py doing sys.path
# surgery. Deliberately an ini option rather than a conftest: it is rootdir-relative
# so there is no __file__ arithmetic to get wrong, and it adds no module named
# `conftest` at the root, which would be one more claimant on a name that several
# suite directories already collide over. See lib/python/dotkit/testing.py.
pythonpath = lib/python

# Every suite root, listed rather than discovered. A suite reached by no entry here is
# a suite that silently does not run: that is how four of these went dark for two
# commits after 7d66f96 deleted the conftest they imported, with make test naming one
# path explicitly and CI calling only make test. pytest merely *warns* when a path
# collects nothing, so lib/python/tests/test_suites.py asserts each one exists and
# that no suite directory is missing from this list.
testpaths =
    lib/python/tests
    roles/ai/files/scripts/claude_kit/tests
    tests
