# Ansible defaults for the apps role
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
#
# Versions are intentionally NOT pinned for VSCODE_EXTENSIONS: VSCode's
# built-in extension auto-update runs in the background regardless of what
# the playbook installed, so pinning at install time is bypassed within hours.
---

VSCODE_EXTENSIONS:
  - biomejs.biome
  - EditorConfig.EditorConfig
  - usernamehw.errorlens
  - GitHub.github-vscode-theme
  - YoavBls.pretty-ts-errors
  - astro-build.astro-vscode
  - Anthropic.claude-code
  - Prisma.prisma
  - bradlc.vscode-tailwindcss

GH_EXTENSIONS:
  - dlvhdr/gh-dash

APPS_SCRIPTS:
  - lokl

# Where Homebrew's caddy reads its config from: `caddy run --config <this>`.
CADDYFILE_PATH: /opt/homebrew/etc/Caddyfile

APPS_DIRS:
  - "{{ HOME }}/.config/gh"
  - "{{ HOME }}/.config/gh-dash"
  - "{{ HOME }}/.config/diffnav"
  - "{{ HOME }}/.config/pgcli"
  - "{{ HOME }}/.config/herdr"
  - "{{ HOME }}/.config/dive"
  - "{{ HOME }}/.docker"
  - "{{ HOME }}/.colima/default"
  - "{{ HOME }}/Library/Application Support/lazygit"
  - "{{ HOME }}/Library/Application Support/jesseduffield/lazydocker"
  - "{{ HOME }}/Library/Application Support/Code/User"

# `src` is relative to files/. Parents must exist already or be listed in APPS_DIRS.
APPS_LINKS:
  # Development
  - src: .gitconfig
    dest: "{{ HOME }}/.gitconfig"
  - src: .gitignore
    dest: "{{ HOME }}/.gitignore"
  - src: lazygit/config.yml
    dest: "{{ HOME }}/Library/Application Support/lazygit/config.yml"
  - src: .npmrc
    dest: "{{ HOME }}/.npmrc"
  - src: gh/config.yml
    dest: "{{ HOME }}/.config/gh/config.yml"
  - src: gh-dash/config.yml
    dest: "{{ HOME }}/.config/gh-dash/config.yml"
  - src: diffnav/config.yml
    dest: "{{ HOME }}/.config/diffnav/config.yml"
  - src: pgcli/config
    dest: "{{ HOME }}/.config/pgcli/config"
  - src: herdr/config.toml
    dest: "{{ HOME }}/.config/herdr/config.toml"
  - src: caddy/Caddyfile
    dest: "{{ CADDYFILE_PATH }}"
  # Caddy resolves `import sites/*.caddyfile` against the directory of the file it was
  # handed, without following the symlink back into this repo. Without this second link
  # the glob matches nothing, which is only a warning, so every dev domain would silently
  # stop being served while the config still validated.
  - src: caddy/sites
    dest: "{{ CADDYFILE_PATH | dirname }}/sites"
  # Editors
  - src: vscode/settings.json
    dest: "{{ HOME }}/Library/Application Support/Code/User/settings.json"
  - src: vscode/keybindings.json
    dest: "{{ HOME }}/Library/Application Support/Code/User/keybindings.json"
  # Infrastructure
  - src: docker/config.json
    dest: "{{ HOME }}/.docker/config.json"
  - src: colima/colima.yaml
    dest: "{{ HOME }}/.colima/default/colima.yaml"
  - src: lazydocker/config.yml
    dest: "{{ HOME }}/Library/Application Support/jesseduffield/lazydocker/config.yml"
  - src: dive/config.yaml
    dest: "{{ HOME }}/.config/dive/config.yaml"
  # System
  - src: .aerospace.toml
    dest: "{{ HOME }}/.aerospace.toml"

BREW_PACKAGES:
  taps:
    - oven-sh/bun
    - getsentry/tools
    - nikitabobko/tap
    - dlvhdr/formulae
    - jmanuelrosa/tap
  # Recorded so installs keep working once Homebrew enforces tap trust by
  # default (5.2/6.0). Granular per Homebrew's docs; jmanuelrosa/tap is our
  # own tap, so it's trusted wholesale.
  trusted:
    - oven-sh/bun/bun
    - getsentry/tools/sentry
    - dlvhdr/formulae/diffnav
    - nikitabobko/tap/aerospace
    - jmanuelrosa/tap
  formulas:
    # Development
    - bruno-cli
    - git
    - git-delta
    - git-filter-repo
    - dlvhdr/formulae/diffnav
    - lazygit
    - gh
    - glab
    - fnm
    - oven-sh/bun/bun
    - pnpm
    - getsentry/tools/sentry
    - herdr
    # Databases
    - libpq
    - pgcli
    # Infrastructure
    - awscli
    # Cloudflare needs wrangler for the Workers platform (deploy, dev, tail) and
    # `cf` for the rest of the account. `cf` is not a brew formula, so tasks/main.yml
    # installs it globally with bun.
    - cloudflare-wrangler
    - colima
    - dive
    - docker
    - docker-compose
    - docker-buildx
    - docker-credential-helper
    - lazydocker
    # Multimedia
    - imagemagick
    - mpv
    # Network
    - caddy
    - nextdns
    # System / window management
    - mole
  casks:
    # Browsers
    - google-chrome
    - helium-browser
    - brave-browser
    - zen
    # Communication
    - slack
    - discord
    - whatsapp
    # Databases
    - dbeaver-community
    # Development
    - bruno
    # Editors
    - visual-studio-code
    # Infrastructure
    - gcloud-cli
    # Multimedia
    - spotify
    - vlc
    # System / window management
    - maccy
    - nikitabobko/tap/aerospace
    - font-fira-code-nerd-font
    - logi-options+
    # Other
    - bitwarden
    - figma
    - notion
    - notion-cli
    - sf-symbols
    - tradingview
    - triage
