# Ansible defaults for the apps role
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
#
# Versions are intentionally NOT pinned for VSCODE_EXTENSIONS — VSCode's
# built-in extension auto-update runs in the background regardless of what
# the playbook installed, so pinning at install time is bypassed within hours.
---

VSCODE_EXTENSIONS:
  - biomejs.biome
  - EditorConfig.EditorConfig
  - usernamehw.errorlens
  - GitHub.github-vscode-theme
  - YoavBls.pretty-ts-errors
  - astro-build.astro-vscode
  - Anthropic.claude-code
  - Prisma.prisma
  - bradlc.vscode-tailwindcss

# Where the Homebrew-provided caddy service reads its config from. The service
# runs `caddy run --config <this>`, so it is the only path Caddy will look at.
CADDYFILE_PATH: /opt/homebrew/etc/Caddyfile

# Where the per-domain site files the Caddyfile imports have to be reachable. Derived
# rather than restated: Caddy resolves an `import` against the directory of the file
# holding it and never follows the Caddyfile symlink back into this repo, so the same
# directory has to exist beside the Caddyfile under whatever prefix that one uses.
CADDY_SITES_PATH: "{{ CADDYFILE_PATH | dirname }}/sites"

# The LaunchDaemon `brew services start caddy` writes. Its presence is the whole
# difference between Caddy running from boot and running when asked, and Caddy is
# wanted on demand only, so the play's job is to keep this path absent.
CADDY_BOOT_PLIST: /Library/LaunchDaemons/homebrew.mxcl.caddy.plist

# Tools symlinked onto PATH from files/scripts/, named rather than globbed, for the same
# reason the ai, work and coreutils roles name theirs: every entry is a directory, and
# Ansible's fileglob lookup filters matches through os.path.isfile, so a glob would match
# nothing and silently install no tools.
APPS_SCRIPTS:
  - lokl

BREW_PACKAGES:
  taps:
    - oven-sh/bun
    - getsentry/tools
    - nikitabobko/tap
    - dlvhdr/formulae
    - jmanuelrosa/tap
  # Recorded so installs keep working once Homebrew enforces tap trust by
  # default (5.2/6.0). Granular per Homebrew's docs; jmanuelrosa/tap is our
  # own tap, so it's trusted wholesale.
  trusted:
    - oven-sh/bun/bun
    - getsentry/tools/sentry
    - dlvhdr/formulae/diffnav
    - nikitabobko/tap/aerospace
    - jmanuelrosa/tap
  formulas:
    # Development
    - bruno-cli
    - git
    - git-delta
    - git-filter-repo
    - dlvhdr/formulae/diffnav
    - lazygit
    - gh
    - glab
    - fnm
    - oven-sh/bun/bun
    - pnpm
    - getsentry/tools/sentry
    - herdr
    # Databases
    - libpq
    - pgcli
    # Infrastructure
    - awscli
    - colima
    - dive
    - docker
    - docker-compose
    - docker-buildx
    - docker-credential-helper
    - lazydocker
    # Multimedia
    - imagemagick
    - mpv
    # Network
    - caddy
    - nextdns
    # System / window management
    - mole
  casks:
    # Browsers
    - google-chrome
    - zen
    - brave-browser
    - helium-browser
    # Communication
    - slack
    - discord
    - whatsapp
    # Databases
    - dbeaver-community
    # Development
    - bruno
    # Editors
    - visual-studio-code
    # Grammar checking across every macOS text field (Slack, VSCode, Chrome,
    # Notion, …) via Accessibility, which the app needs granted by hand once.
    # Deliberately NOT the `harper` formula: that ships harper-ls + harper-cli
    # for editors driving an LSP, which nothing here does — the Harper VSCode
    # and Chrome extensions were removed in favour of this one app, so the
    # desktop integrations in its config.json now cover those surfaces.
    - harper-desktop
    # Infrastructure
    - gcloud-cli
    # Multimedia
    - blackhole-16ch
    - spotify
    - vlc
    # System / window management
    - maccy
    - nikitabobko/tap/aerospace
    - font-fira-code-nerd-font
    - logi-options+
    # Other
    - bitwarden
    - figma
    - notion
    - notion-cli
    - sf-symbols
    - tradingview
    - triage
