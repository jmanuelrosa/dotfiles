# Ansible role to install and configure all infrastructure apps
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
---

- name: Remove orphaned docker-completion formula
  # The docker formula now bundles its own completions; the old standalone
  # docker-completion formula collides with `brew link docker`. Idempotent:
  # no-op once it's gone.
  community.general.homebrew:
    name: docker-completion
    state: absent

- name: Link docker formula
  ansible.builtin.command: brew link docker
  register: docker_link
  changed_when: "'Linking' in docker_link.stdout"
  failed_when: docker_link.rc != 0 and 'Already linked' not in docker_link.stderr

- name: Symlink docker config
  ansible.builtin.file:
    src: "{{ role_path }}/files/docker/config.json"
    dest: "{{ HOME }}/.docker/config.json"
    state: link
    force: true

- name: Remove ctop, superseded by lazydocker
  # Dropping a formula from BREW_PACKAGES never uninstalls it: the install task
  # is state=present only. Idempotent: no-op once it's gone.
  community.general.homebrew:
    name: ctop
    state: absent

- name: Remove orphaned ctop config directory
  ansible.builtin.file:
    path: "{{ HOME }}/.config/ctop"
    state: absent

- name: Ensure lazydocker config directory exists
  ansible.builtin.file:
    path: "{{ HOME }}/Library/Application Support/jesseduffield/lazydocker"
    state: directory
    mode: "0755"

- name: Symlink lazydocker config
  ansible.builtin.file:
    src: "{{ role_path }}/files/lazydocker/config.yml"
    dest: "{{ HOME }}/Library/Application Support/jesseduffield/lazydocker/config.yml"
    state: link
    force: true

- name: Ensure dive config directory exists
  ansible.builtin.file:
    path: "{{ HOME }}/.config/dive"
    state: directory
    mode: "0755"

- name: Symlink dive config
  ansible.builtin.file:
    src: "{{ role_path }}/files/dive/config.yaml"
    dest: "{{ HOME }}/.config/dive/config.yaml"
    state: link
    force: true

- name: Install the cf Cloudflare CLI
  # Cloudflare publishes `cf` on npm only, so it can't ride along with the brew
  # formulas. `creates` keeps this to a first-run install: `cf` is a technical
  # preview, so moving to a newer one is a deliberate `bun add -g cf` by hand.
  ansible.builtin.command:
    cmd: bun add -g cf
    creates: "{{ HOME }}/.bun/bin/cf"
