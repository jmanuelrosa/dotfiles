# Ansible role to install and configure desktop apps and their configs
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
---

- name: Install app Homebrew packages
  ansible.builtin.include_tasks: "{{ CURRENT_DIR }}/roles/brew/tasks/packages.yml"

# `state: link` does not create parents the way `state: directory` does.
- name: Ensure app config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ APPS_DIRS }}"

- name: Link app configs
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ APPS_LINKS }}"
  loop_control:
    label: "{{ item.dest }}"

# ~/.local/bin is created by the coreutils role, which runs before this one in every profile.
- name: Link app scripts into the user bin directory
  ansible.builtin.file:
    src: "{{ role_path }}/files/scripts/{{ item }}/{{ item }}"
    dest: "{{ HOME }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop: "{{ APPS_SCRIPTS }}"

- name: Verify gh is authenticated for github.com
  ansible.builtin.command: gh auth status --hostname github.com
  environment:
    GH_TOKEN: ""
    GITHUB_TOKEN: ""
  register: gh_auth_check
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: Fail loudly if gh is not authenticated
  ansible.builtin.fail:
    msg: |
      gh is not authenticated for github.com.

      From a normal terminal (outside this playbook), run:
        gh auth login --hostname github.com --git-protocol ssh

      Pick "Login with a web browser" and follow the prompts.
      The OAuth token is stored only in the macOS keychain.

      Then re-run the playbook.
  when: gh_auth_check.rc != 0

- name: List installed gh extensions
  ansible.builtin.command: gh extension list
  register: gh_extensions_installed
  changed_when: false
  failed_when: gh_extensions_installed.rc not in [0, 1]
  check_mode: false

# gh refuses to install over an existing copy of the same extension, so one installed at
# another release is removed right before the pinned one goes in.
- name: Install gh extensions at their pinned release
  ansible.builtin.shell: |
    {% if item.repository in gh_extensions_installed.stdout %}
    gh extension remove {{ item.repository | basename | regex_replace('^gh-', '') }} || exit 1
    {% endif %}
    gh extension install {{ item.repository }} --pin {{ item.release }}
  loop: "{{ GH_EXTENSIONS }}"
  changed_when: true
  when: >-
    gh_extensions_installed.stdout_lines
    | select('search', '\s' ~ (item.repository | regex_escape) ~ '\s+' ~ (item.release | regex_escape) ~ '(\s|$)')
    | list | length == 0

- name: Read the installed cf Cloudflare CLI manifest
  ansible.builtin.slurp:
    src: "{{ bun_global_dir }}/node_modules/{{ CF_CLI.package }}/package.json"
  register: cf_cli_manifest
  failed_when: false
  vars:
    bun_install: "{{ ansible_facts['env']['BUN_INSTALL'] | default(HOME ~ '/.bun', true) }}"
    bun_global_dir: "{{ ansible_facts['env']['BUN_INSTALL_GLOBAL_DIR'] | default(bun_install ~ '/install/global', true) }}"

- name: Install the pinned cf Cloudflare CLI
  ansible.builtin.command:
    cmd: bun add -g {{ CF_CLI.package }}@{{ CF_CLI.version }}
  changed_when: true
  when: >-
    cf_cli_manifest.content is not defined
    or (cf_cli_manifest.content | b64decode | from_json).version != CF_CLI.version

- name: List installed VSCode extensions
  ansible.builtin.command: code --list-extensions
  register: vscode_installed
  changed_when: false
  check_mode: false

- name: Install VSCode extensions
  ansible.builtin.command: code --install-extension {{ item }}
  loop: "{{ VSCODE_EXTENSIONS }}"
  when: item not in vscode_installed.stdout_lines
  changed_when: true
