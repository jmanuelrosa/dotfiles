# Ansible role to install and configure all development apps
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
---

- name: Symlink git config and ignore
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "{{ HOME }}/{{ item }}"
    state: link
    force: true
  with_items:
    - .gitconfig
    - .gitignore

- name: Symlink lazygit config
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "{{ HOME }}/Library/Application Support/{{ item }}"
    state: link
    force: true
  with_items:
    - lazygit/config.yml

- name: Symlink npmrc
  ansible.builtin.file:
    src: "{{ role_path }}/files/.npmrc"
    dest: "{{ HOME }}/.npmrc"
    state: link
    force: true

- name: Symlink gh (GitHub CLI) config
  ansible.builtin.file:
    src: "{{ role_path }}/files/gh/config.yml"
    dest: "{{ HOME }}/.config/gh/config.yml"
    state: link
    force: true

- name: Verify gh is authenticated for github.com
  ansible.builtin.command: gh auth status --hostname github.com
  environment:
    GH_TOKEN: ""
    GITHUB_TOKEN: ""
  register: gh_auth_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Fail loudly if gh is not authenticated
  ansible.builtin.fail:
    msg: |
      gh is not authenticated for github.com.

      From a normal terminal (outside this playbook), run:
        gh auth login --hostname github.com --git-protocol ssh

      Pick "Login with a web browser" and follow the prompts. The OAuth
      token is stored only in the macOS keychain — this repo no longer
      keeps any GitHub credential on disk.

      Then re-run the playbook.
  when: gh_auth_check.rc != 0

- name: Install gh-dash (PR/issue dashboard) gh extension
  ansible.builtin.command: gh extension install dlvhdr/gh-dash
  args:
    creates: "{{ HOME }}/.local/share/gh/extensions/gh-dash"

- name: Ensure gh-dash config directory exists
  ansible.builtin.file:
    path: "{{ HOME }}/.config/gh-dash"
    state: directory
    mode: "0755"

- name: Symlink gh-dash config
  ansible.builtin.file:
    src: "{{ role_path }}/files/gh-dash/config.yml"
    dest: "{{ HOME }}/.config/gh-dash/config.yml"
    state: link
    force: true

- name: Ensure diffnav config directory exists
  ansible.builtin.file:
    path: "{{ HOME }}/.config/diffnav"
    state: directory
    mode: "0755"

- name: Symlink diffnav config
  ansible.builtin.file:
    src: "{{ role_path }}/files/diffnav/config.yml"
    dest: "{{ HOME }}/.config/diffnav/config.yml"
    state: link
    force: true

- name: Ensure pgcli config directory exists
  ansible.builtin.file:
    path: "{{ HOME }}/.config/pgcli"
    state: directory
    mode: "0755"

- name: Symlink pgcli config
  ansible.builtin.file:
    src: "{{ role_path }}/files/pgcli/config"
    dest: "{{ HOME }}/.config/pgcli/config"
    state: link
    force: true

- name: Ensure herdr config directory exists
  ansible.builtin.file:
    path: "{{ HOME }}/.config/herdr"
    state: directory
    mode: "0755"

- name: Symlink herdr config
  ansible.builtin.file:
    src: "{{ role_path }}/files/herdr/config.toml"
    dest: "{{ HOME }}/.config/herdr/config.toml"
    state: link
    force: true

# No become: the Homebrew prefix is owned by this user on Apple Silicon.
- name: Symlink the Caddyfile
  ansible.builtin.file:
    src: "{{ role_path }}/files/caddy/Caddyfile"
    dest: "{{ CADDYFILE_PATH }}"
    state: link
    force: true

# The Caddyfile's `import sites/*.caddyfile` is resolved against the directory holding
# the file Caddy was handed, which is the Homebrew prefix rather than this repo: Caddy
# does not follow the symlink above before resolving it. Without this second link the
# glob matches nothing, which is only a warning, so every dev domain would silently stop
# being served while the config still validated.
- name: Symlink the Caddy site directory
  ansible.builtin.file:
    src: "{{ role_path }}/files/caddy/sites"
    dest: "{{ CADDY_SITES_PATH }}"
    state: link
    force: true

# ~/.local/bin is created by the coreutils role, which runs before this one in every
# profile, so this role links into it without creating it.
- name: Link app scripts into the user bin directory
  ansible.builtin.file:
    src: "{{ role_path }}/files/scripts/{{ item }}/{{ item }}"
    dest: "{{ HOME }}/.local/bin/{{ item }}"
    state: link
    force: true
  # One directory per tool, and the executable inside carries the tool's name, so the
  # source is <name>/<name>. src stays absolute: ansible.builtin.file does not resolve it
  # through the role search path the way copy and template do, and a relative one would
  # be read against ~/.local/bin and written as a dangling link that still reports changed.
  loop: "{{ APPS_SCRIPTS }}"

# Caddy is deliberately not started here: the dev domains are wanted on demand, and
# `lokl start` / `lokl stop` are the on switch. Those drive Caddy's own
# `start` subcommand rather than brew services, which cannot express what this needs:
# binding :80 requires root, and `brew services run` is refused as root outright, leaving
# only `start`, which registers the boot plist this task exists to remove.
#
# `stop` is what removes the LaunchDaemon, so this converts a machine that ran the
# earlier `brew services start` and is a no-op on every run after. It cannot stop a
# hand-started Caddy by accident: nothing in `lokl start` involves launchd at all, so
# `removes` sees no file.
#
# Homebrew derives its cache from $HOME, and become runs `sudo -H`, so root lands on
# /var/root/Library/Caches/Homebrew, where the packages API JSON is absent; brew then
# aborts rather than download it as root. Handing it this user's cache is read-only in
# practice: brew skips every cache download outright when it runs as root over a
# user-owned prefix. Bootsnap is the one thing that would still write, and root-owned
# compile caches in there are files the user's own brew could no longer replace.
- name: Ensure Caddy is not registered to start at boot
  become: true
  environment:
    HOMEBREW_CACHE: "{{ HOME }}/Library/Caches/Homebrew"
    HOMEBREW_NO_BOOTSNAP: "1"
  ansible.builtin.command:
    cmd: brew services stop caddy
    removes: "{{ CADDY_BOOT_PLIST }}"
  changed_when: true
