# Ansible role for macOS system preferences and firmware tweaks.
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
---

- name: Apply macOS user defaults
  community.general.osx_defaults:
    domain: "{{ item.domain }}"
    key: "{{ item.key }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    state: "{{ item.state }}"
  loop: "{{ OSX_DEFAULTS }}"

- name: Read firmware and power state
  ansible.builtin.command: "{{ item }}"
  loop:
    - nvram SystemAudioVolume
    - pmset -g custom
    - stat -f %Sf /private/var/vm/sleepimage
  register: macos_firmware_state
  changed_when: false
  failed_when: false

- name: Mute boot sound  # noqa: command-instead-of-shell
  become: true
  ansible.builtin.shell: nvram SystemAudioVolume=" "
  when: macos_firmware_state.results[0].stdout != 'SystemAudioVolume\t '
  changed_when: true

- name: Disable hibernation (speeds up entering sleep mode)
  become: true
  ansible.builtin.command: pmset -a hibernatemode 0
  when: macos_firmware_state.results[1].stdout is search('hibernatemode\\s+[1-9]')
  changed_when: true

- name: Remove the sleep image file and prevent recreation
  become: true
  ansible.builtin.shell: |
    rm -f /private/var/vm/sleepimage
    touch /private/var/vm/sleepimage
    chflags uchg /private/var/vm/sleepimage
  when: "'uchg' not in macos_firmware_state.results[2].stdout"
  changed_when: true
