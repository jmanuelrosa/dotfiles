# Ansible role to configure all related to shell
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
---

- name: Install shell Homebrew packages
  ansible.builtin.include_tasks: "{{ CURRENT_DIR }}/roles/brew/tasks/packages.yml"

- name: Add fish as a known shell
  become: true
  ansible.builtin.lineinfile:
    path: /etc/shells
    line: "{{ FISH_PATH }}"
    state: present

- name: Make fish as our default shell
  become: true
  ansible.builtin.user:
    name: "{{ USER }}"
    shell: "{{ FISH_PATH }}"
    state: present

- name: List installed fish plugins
  ansible.builtin.shell: fisher list
  args:
    executable: "{{ FISH_PATH }}"
  register: fisher_installed
  changed_when: false
  failed_when: not ansible_check_mode and fisher_installed.rc not in [0, 1]
  check_mode: false

# fisher keys a plugin by its whole `owner/repo@ref` string, so the same repo installed at
# another ref must go first: installing the new pin beside it conflicts on its files. Each
# swap happens right before its own install, so a failed fetch costs one plugin, not all.
- name: Install fish plugins at their pinned ref
  ansible.builtin.shell: |
    for stale in (fisher list '^{{ plugin_repo }}(@.*)?$')
        fisher remove $stale
    end
    fisher install {{ item }}
  args:
    executable: "{{ FISH_PATH }}"
  vars:
    plugin_repo: "{{ item | lower | split('@') | first | regex_escape }}"
  loop: "{{ FISH_PLUGINS }}"
  changed_when: true
  when: (item | lower) not in (fisher_installed.stdout_lines | default([]))

- name: Ensure shell config directories exist
  ansible.builtin.file:
    path: "{{ HOME }}/{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - .config/fish/conf.d
    - .config/fish/functions
    - .config/gcloud-profiles
    - .config/ghostty
    - .config/television/cable
    - .config/television/shell
    - .local/bin

- name: Install the pinned standalone tools
  ansible.builtin.get_url:
    url: "{{ item.value.repository }}/releases/download/{{ item.value.release }}/{{ item.key }}"
    dest: "{{ HOME }}/.local/bin/{{ item.key }}"
    checksum: "{{ item.value.checksum }}"
    mode: "0755"
  loop: "{{ {'lns': LNS, 'shoo': SHOO} | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value.release }}"

- name: Symlink shell configs
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item.src }}"
    dest: "{{ HOME }}/.config/{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: fish/config.fish
      dest: fish/config.fish
    - src: fish/conf.d/gcloud-profiles/config.json
      dest: gcloud-profiles/config.json
    - src: ghostty/config
      dest: ghostty/config
    - src: starship.toml
      dest: starship.toml
    - src: television/config.toml
      dest: television/config.toml
  loop_control:
    label: "{{ item.dest }}"

- name: Discover fish conf.d snippets
  ansible.builtin.find:
    paths: "{{ role_path }}/files/fish/conf.d"
    patterns: "*.fish"
    file_type: file
    recurse: true
  register: fish_confd_sources

- name: Require unique fish conf.d filenames
  ansible.builtin.assert:
    that:
      - fish_confd_names | unique | length == fish_confd_names | length
    fail_msg: "Fish conf.d snippets must have unique filenames across feature directories"
  vars:
    fish_confd_names: "{{ fish_confd_sources.files | map(attribute='path') | map('basename') | list }}"

- name: Symlink fish conf.d
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ HOME }}/.config/fish/conf.d/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ fish_confd_sources.files | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Discover fish function sources
  ansible.builtin.find:
    paths: "{{ role_path }}/files/fish/functions"
    patterns: "*.fish"
    file_type: file
    recurse: true
  register: fish_function_sources

- name: Require unique fish function filenames
  ansible.builtin.assert:
    that:
      - fish_function_names | unique | length == fish_function_names | length
    fail_msg: "Fish functions must have unique filenames across feature directories"
  vars:
    fish_function_names: "{{ fish_function_sources.files | map(attribute='path') | map('basename') | list }}"

- name: Symlink fish functions
  ansible.builtin.file:
    src: "{{ item.path }}"
    dest: "{{ HOME }}/.config/fish/functions/{{ item.path | basename }}"
    state: link
    force: true
  loop: "{{ fish_function_sources.files | sort(attribute='path') }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Symlink television custom channels
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ HOME }}/.config/television/cable/{{ item | basename }}"
    state: link
    force: true
  with_fileglob:
    - "{{ role_path }}/files/television/cable/*.toml"

# A file deleted or renamed in the repo leaves its link dangling, and fish keeps
# autoloading by filename, so a dead function stays tab-completable. With -L, `-type l`
# matches only broken links, and -lname narrows them to the ones this role wrote, so the
# work role's helpers and anything linked by hand stay put.
- name: Remove shell links whose source left the repo
  ansible.builtin.command:
    argv:
      - find
      - -L
      - "{{ HOME }}/.config/fish/conf.d"
      - "{{ HOME }}/.config/fish/functions"
      - "{{ HOME }}/.config/television/cable"
      - -maxdepth
      - "1"
      - -type
      - l
      - -lname
      - "{{ role_path }}/files/*"
      - -print
      - -exec
      - rm
      - "{}"
      - ;
  register: shell_prune
  changed_when: shell_prune.stdout | length > 0

- name: Sync upstream television channels
  ansible.builtin.command: tv update-channels
  changed_when: false

- name: Discover upstream television cables
  ansible.builtin.find:
    paths: "{{ HOME }}/.config/television/cable"
    patterns: "*.toml"
    file_type: file
  register: tv_cable_files

- name: Prune upstream cables not in TV_CABLE_ALLOWLIST
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ tv_cable_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename | regex_replace('\.toml$', '')) not in TV_CABLE_ALLOWLIST

- name: Generate television shell integration for fish
  ansible.builtin.shell: tv init fish > {{ HOME }}/.config/television/shell/integration.fish
  args:
    creates: "{{ HOME }}/.config/television/shell/integration.fish"

- name: Render fish secrets file from vault
  ansible.builtin.template:
    src: secrets.fish.j2
    dest: "{{ HOME }}/.config/fish/conf.d/secrets.fish"
    mode: "0600"
  # The copy on disk from before the keychain move still holds the token, and a diff would print it.
  diff: false

- name: Mirror NPM_TOKEN into the login keychain
  ansible.builtin.include_tasks: keychain_token.yml
  vars:
    keychain_token_value: "{{ NPM_TOKEN }}"
    keychain_token_service: "{{ NPM_TOKEN_KEYCHAIN.service }}"
    keychain_token_account: "{{ NPM_TOKEN_KEYCHAIN.account }}"
