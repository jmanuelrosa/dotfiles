[metadata]
name = "kura-skills"
description = "Manage skills and install whole categories (toggle link, check outdated, update)"
requirements = ["fish", "jq", "bat", "kura"]

[source]
ansi = true
env = { FORCE_COLOR = "1" }
command = [
  { name = "No global", run = "fish -c '_tv_kura_list skill noglobal'" },
  { name = "Linked",    run = "fish -c '_tv_kura_list skill linked'" },
  { name = "Available", run = "fish -c '_tv_kura_list skill available'" },
  { name = "All",       run = "fish -c '_tv_kura_list skill'" },
  { name = "Categories", run = "fish -c '_tv_kura_list skill categories'" },
]
output = "{split: :0}"

[preview]
command = "fish -c '_tv_kura_skill_action preview {split: :0}'"

[ui]
layout = "portrait"

[ui.input_bar]
header = "Skills | Enter toggle | Tab select | Ctrl-S views"

[ui.preview_panel]
header = "{split: :0}"
footer = "Ctrl-D outdated | Ctrl-U update | Ctrl-O edit"

[keybindings]
enter = "actions:toggle"
ctrl-d = "actions:outdated"
ctrl-u = "actions:update"
ctrl-o = "actions:edit"

# Unlike `output`, which tv applies per entry, an action template is applied ONCE to
# every selected row joined by `separator`. So the bare `{split: :0}` the preview uses
# would take field 0 of the whole concatenation and pass a single arbitrary name (the
# selection is an unordered set), silently dropping the rest of a Tab multi-select.
# Joining on a newline instead (rows hold spaces but never one) makes each row an item,
# and `map:` then takes field 0 of each. `\\n` in TOML is the two characters
# string_pipeline unescapes; `separator` wants the real byte.
[actions.toggle]
description = "Toggle skill links or install every skill in selected categories"
command = "fish -c '_tv_kura_skill_action toggle {split:\\n:..|map:{split: :0}|join: }'"
mode = "execute"
separator = "\n"

[actions.outdated]
description = "Check if the skill is up-to-date"
command = "fish -c '_tv_kura_skill_action outdated {split:\\n:..|map:{split: :0}|join: }'"
mode = "execute"
separator = "\n"

[actions.update]
description = "Sync the skill from upstream"
command = "fish -c '_tv_kura_skill_action update {split:\\n:..|map:{split: :0}|join: }'"
mode = "execute"
separator = "\n"

[actions.edit]
description = "Open SKILL.md in $EDITOR"
command = "fish -c '_tv_kura_skill_action edit {split:\\n:..|map:{split: :0}|join: }'"
mode = "execute"
separator = "\n"
