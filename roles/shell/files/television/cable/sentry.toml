[metadata]
name = "sentry"
description = "Browse recent Sentry issues for the current project"
requirements = ["sentry", "jq"]

[source]
command = "sentry issue list --json --fields shortId,level,title 2>/dev/null | jq -r '(if type == \"array\" then . else .data end)[] | \"\\(.shortId)  \\(.level)  \\(.title)\"'"
output = "{split: :0}"

[preview]
command = "sentry issue view {split: :0} 2>/dev/null"

[ui]
layout = "portrait"

[keybindings]
enter = "actions:open-browser"

[actions.open-browser]
description = "Open the issue in the browser"
command = "sentry issue view {split: :0} --web"
mode = "execute"
