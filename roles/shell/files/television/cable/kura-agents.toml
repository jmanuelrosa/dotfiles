[metadata]
name = "kura-agents"
description = "Manage catalog agents (toggle link, edit)"
requirements = ["fish", "jq", "bat", "kura"]

[source]
command = [
  { name = "No global", run = "fish -c '_tv_kura_list agent noglobal'" },
  { name = "Linked",    run = "fish -c '_tv_kura_list agent linked'" },
  { name = "Available", run = "fish -c '_tv_kura_list agent available'" },
  { name = "All",       run = "fish -c '_tv_kura_list agent'" },
]
output = "{split: :0}"

# An agent lives at the catalog root or inside the bundle that ships it, and `**/` matches both.
# The glob goes through `set` because fish prints an unmatched glob's error past any redirect.
[preview]
command = "set -l f $DOTFILES_DIR/roles/ai/files/harness/kura/catalog/**/agents/{split: :0}.md; test -n \"$f\"; and bat --color=always --plain --language=markdown $f; or echo 'Not in the catalog'"

[ui]
layout = "portrait"

[keybindings]
enter = "actions:toggle"
ctrl-o = "actions:edit"

# No outdated/update actions: kura refuses both for agents, since only skills carry upstreams.
# Actions split the selection on a newline for the reason given in kura-skills.toml.
[actions.toggle]
description = "Toggle the agent link in this project"
command = "fish -c '_tv_kura_toggle agent {split:\\n:..|map:{split: :0}|join: }'"
mode = "execute"
separator = "\n"

[actions.edit]
description = "Open the agent definition in $EDITOR"
command = "$EDITOR {split:\\n:..|map:{split: :0|prepend:$DOTFILES_DIR/roles/ai/files/harness/kura/catalog/**/agents/|append:.md}|join: }"
mode = "execute"
separator = "\n"
