# Ansible defaults for the shell role
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)

---

LNS:
  repository: https://github.com/jmanuelrosa/lns
  release: v0.1.0
  checksum: sha256:ce88ce79923e1589873aa91b37d8be41a22c433ba743ce1daced3bde3df963f0

SHOO:
  repository: https://github.com/jmanuelrosa/shoo
  release: v0.2.0
  checksum: sha256:f3a8bca655b7e68ff2b1e40547dcd05c6447b23feaa3eac3ad00d1a8c3e0af70

FISH_PATH: /opt/homebrew/bin/fish

# Each plugin is pinned as `owner/repo@ref`, which fisher fetches as that GitHub tarball.
# fish-ssh-agent publishes no tags, so it is pinned to a commit instead.
FISH_PLUGINS:
  - danhper/fish-ssh-agent@f10d95775352931796fd17f54e6bf2f910163d1b
  - franciscolourenco/done@1.21.1
  - jorgebucaran/autopair.fish@1.0.4
  - jorgebucaran/replay.fish@1.2.1
  - nickeb96/puffer-fish@v1.1.0

BREW_PACKAGES:
  formulas:
    - fish
    - fisher
    - jq
    - starship
    - gnupg
  casks:
    - ghostty

# Upstream television cables to keep after `tv update-channels`.
# Any non-symlink .toml in ~/.config/television/cable/ whose basename
# (minus .toml) is not in this list gets pruned each run. Symlinks
# (i.e. cables vendored in roles/shell/files/television/cable/) are
# always preserved regardless of this list.
TV_CABLE_ALLOWLIST:
  - brew-packages
  - dirs
  - files
  - fish-history
  - git-worktrees

# Login keychain item holding NPM_TOKEN. The role writes it from the vault and the npm_token
# fish wrappers read it back per call, so the token is never exported.
NPM_TOKEN_KEYCHAIN:
  service: dotfiles-npm-token
  account: "{{ USER }}"
