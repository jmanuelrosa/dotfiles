# Ansible role to install HomeBrew and dependencies
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
---

# bootstrap.sh installs Homebrew before Ansible exists, so it is always present here.
- name: Update Homebrew
  community.general.homebrew:
    update_homebrew: true

- name: Install brew Homebrew packages
  ansible.builtin.include_tasks: packages.yml
