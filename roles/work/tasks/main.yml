# Ansible role to configure all related to work
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
---

- name: Install work Homebrew packages
  ansible.builtin.include_tasks: "{{ CURRENT_DIR }}/roles/brew/tasks/packages.yml"

- name: Symlink the Jira television cable and its fish helper
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "{{ HOME }}/.config/{{ item }}"
    state: link
    force: true
  loop:
    - television/cable/jira.toml
    - fish/functions/_tv_jira.fish

- name: Render work secrets file from vault
  ansible.builtin.template:
    src: exports.fish.j2
    dest: "{{ HOME }}/.config/fish/conf.d/work-secrets.fish"
    mode: "0600"
  # The copy on disk from before the keychain move still holds the token, and a diff would print it.
  diff: false

- name: Mirror DID_NPM_TOKEN into the login keychain
  ansible.builtin.include_tasks: "{{ CURRENT_DIR }}/roles/shell/tasks/keychain_token.yml"
  vars:
    keychain_token_value: "{{ DID_NPM_TOKEN }}"
    keychain_token_service: "{{ DID_NPM_TOKEN_KEYCHAIN.service }}"
    keychain_token_account: "{{ DID_NPM_TOKEN_KEYCHAIN.account }}"

# ~/.local/bin is created by the coreutils role, which runs first.
- name: Link work scripts into the user bin directory
  ansible.builtin.file:
    src: "{{ role_path }}/files/scripts/{{ item }}/{{ item }}"
    dest: "{{ HOME }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop: "{{ WORK_SCRIPTS }}"

- name: Ensure glab-cli config directory exists
  ansible.builtin.file:
    path: "{{ HOME }}/Library/Application Support/glab-cli"
    state: directory
    mode: "0755"

- name: Render glab config with personal + work hosts
  ansible.builtin.template:
    src: glab/config.yml.j2
    dest: "{{ HOME }}/Library/Application Support/glab-cli/config.yml"
    mode: "0600"
    force: true
  # glab writes tokens into this file when a host was authenticated without --use-keyring.
  diff: false

- name: Verify glab is authenticated for each gitlab host
  ansible.builtin.command: glab auth status --hostname {{ item }}
  environment:
    GLAB_TOKEN: ""
    GITLAB_TOKEN: ""
    GITLAB_ACCESS_TOKEN: ""
    OAUTH_TOKEN: ""
  loop:
    - gitlab.com
    - gitlab.com-work
  register: glab_auth_check
  changed_when: false
  failed_when: false
  no_log: true

- name: Fail loudly if any glab host is not authenticated
  ansible.builtin.fail:
    msg: |
      glab is not authenticated for one or more configured hosts.

      For each host that's missing, from a normal terminal:
        1. Create a GitLab personal access token at
           https://gitlab.com/-/user_settings/personal_access_tokens
           Use the matching GitLab account (personal or work) when creating it.
        2. Run, replacing <HOST> with the host that needs auth:
             glab auth login --hostname <HOST> --git-protocol ssh --use-keyring
           Paste the PAT when prompted.

      gitlab.com-work is a local alias, not a real domain, so glab asks a few
      extra questions. Answer with the real gitlab.com values for everything
      except the SSH hostname:
        - API hostname:               gitlab.com
        - SSH hostname:               gitlab.com-work
        - Container registry domains: gitlab.com,gitlab.com:443,registry.gitlab.com
      (The SSH hostname keeps the alias because ~/.ssh/config resolves it to
      the real gitlab.com using the work key id_didomi.)

      The tokens are stored in the macOS keychain, so this repo keeps no
      GitLab credentials on disk. See roles/work/README.md (GitLab auth) for
      the full explanation.

      Then re-run the playbook.
  when: glab_auth_check.results | selectattr('rc', 'ne', 0) | list | length > 0
