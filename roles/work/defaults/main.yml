# Ansible defaults for the work role
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
# Secrets live in vars/work.yml (vault-encrypted) — see vars/work.yml.example.
---

BREW_PACKAGES:
  taps:
    - atlassian/homebrew-acli
  trusted:
    # Canonical name drops the homebrew- prefix from the tap repo above.
    - atlassian/acli/acli
  formulas:
    - acli

# Tools symlinked onto PATH from files/scripts/, one directory per tool with the
# executable named after it. Same convention and the same reasons as the ai role's
# AI_SCRIPTS: a glob would match only directories, which fileglob discards.
WORK_SCRIPTS:
  - s-db
  - s-release
  - s-task
  - weekly-recap

# Login keychain item holding DID_NPM_TOKEN. The role writes it from the vault and the
# npm_token fish wrappers read it back per call, so the token is never exported.
DID_NPM_TOKEN_KEYCHAIN:
  service: dotfiles-did-npm-token
  account: "{{ USER }}"
