# Ansible role for command-line utilities (bat, eza, fd, ripgrep, television, etc.)
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
---

- name: Install coreutils Homebrew packages
  ansible.builtin.include_tasks: "{{ CURRENT_DIR }}/roles/brew/tasks/packages.yml"

# coreutils runs before the ai role, which also creates ~/.local/bin, and the hostof
# release needs its destination to exist on a fresh machine.
- name: Ensure coreutils directories exist
  ansible.builtin.file:
    path: "{{ HOME }}/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ ['.local/bin'] + (COREUTILS_CONFIGS | map('dirname') | map('regex_replace', '^', '.config/') | list) }}"

- name: Install the pinned hostof release
  ansible.builtin.get_url:
    url: "{{ HOSTOF.repository }}/releases/download/{{ HOSTOF.release }}/hostof"
    dest: "{{ HOME }}/.local/bin/hostof"
    checksum: "{{ HOSTOF.checksum }}"
    mode: "0755"

- name: Symlink coreutils configs
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "{{ HOME }}/.config/{{ item }}"
    state: link
    force: true
  loop: "{{ COREUTILS_CONFIGS }}"
