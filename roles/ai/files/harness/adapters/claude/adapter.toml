# Claude Code knobs with no counterpart in the neutral policy.
# harness-build owns `permissions`, `sandbox`, `skillOverrides` and `pluginConfigs.agents-md@builtin` in settings.json,
# plus every entry of `hooks` whose command policy/hooks.toml renders (herdr's own entries are kept);
# every other key there stays hand-edited.

[install]
mcp_config = "~/.claude.json"
mcp_state = "~/.claude/.harness-mcp-owned.json"

[sandbox]
enabled = true
autoAllowBashIfSandboxed = true
allowUnsandboxedCommands = false
# Opening com.apple.trustd.agent is only needed behind a MITM proxy with a custom CA
# (network.httpProxyPort), which this config does not set, and it is an exfiltration path.
enableWeakerNetworkIsolation = false
excludedCommands = [
  "git *",
  "gh *",
  "glab *",
  "pgcli *",
  "acli *",
  "sentry *",
  "bru *",
  "ntn *",
  "wrangler *",
  "cf *",
  "python3 ~/.claude/skills/commit/scripts/apply.py *",
  "python3 ~/.claude/skills/pr/scripts/apply.py *",
  "bunx ctx7 *",
  "npx -y ctx7 *",
  "aws *",
  "gcloud *",
  "gsutil *",
  "bq *",
]

# Skill name to on | name-only | user-invocable-only | off, so an upstream skill's visibility
# changes without editing a SKILL.md that `kura update` would overwrite. Every `dependency_only`
# skill in the registry is already rendered as name-only; an entry here wins over that.
[skill_overrides]

[plugin_configs."agents-md@builtin".options]
instructionFiles = "claude-md-and-agents-md"

# Where the role links hooks/, so a manifest `script` is spelled as Claude runs it.
[hooks]
dir = "~/.claude/hooks"
