# What a sandboxed command may reach. `{harness}` is this directory, wherever it is checked out.
# `make harness` renders it into each harness's own files; edit here, never there.

# Run outside the sandbox in every harness, by executable name. gcloud and bq keep their
# credentials and token cache under ~/.config/gcloud, which deny_read fences off, so sandboxed
# they cannot authenticate at all. cloud-readonly-gate still stands in front of every
# mutating verb, and Pi exempts only a direct call with no chaining, pipes or substitution.
excluded_commands = ["gcloud", "bq"]

# Set for every command an agent starts, hooks included.
# SSL_CERT_FILE is the half of the trustd decision in adapters/claude/adapter.toml that every
# harness needs: Go CLIs (gh, glab, pulumi, terraform) read this bundle instead of asking
# com.apple.trustd.agent, which the sandbox keeps closed. A CA trusted only in the Keychain
# is not in that bundle. The pagers are off because no agent can drive an interactive one.
[env]
SSL_CERT_FILE = "/etc/ssl/cert.pem"
GIT_PAGER = "cat"
PAGER = "cat"
AWS_PAGER = ""

[network]
allow_domains = [
  "registry.npmjs.org",
  "registry.yarnpkg.com",
  "sentry.io",
  "*.sentry.io",
  "github.com",
  "api.github.com",
  "gitlab.com",
  "*.githubusercontent.com",
  "auth.atlassian.com",
  "as.atlassian.com",
  "api.atlassian.com",
  "developers.notion.com",
  "api.notion.com",
  "context7.com",
  "*.context7.com",
  "api.anthropic.com",
  "services.nvd.nist.gov",
  "api.osv.dev",
  "www.cisa.gov",
  "api.first.org",
  "releases.electronjs.org",
  "nodejs.org",
]
allow_local_binding = true

[filesystem]
allow_write = [
  ".",
  "/tmp",
  "$TMPDIR",
  "~/.bun/install/cache",
  "~/.npm/_cacache",
  "~/.npm/_npx",
  "~/.cache/uv",
  "~/.work",
  "~/.work-archive",
]
allow_read = [
  "~/.config/gh",
  "~/.lima",
  "~/.gitconfig",
  "~/.ssh/known_hosts",
  "/etc/ssl/cert.pem",
  "~/.config/acli",
  "~/Developer/agent-catalog/skills",
  "{harness}/hooks",
  "~/Developer/agent-catalog/bundles",
  "{harness}/adapters/claude/settings.json",
]
deny_read = [
  "~/.ssh",
  "~/.gnupg",
  "~/.aws",
  "~/.npmrc",
  "~/.netrc",
  "~/.config/gcloud",
  "~/.terraform.d/credentials.tfrc.json",
  "~/Library/Preferences/.wrangler",
  "~/.sentry",
  "~/.config/sentry",
]
