# What any agent may run, read and edit, in no harness's spelling.
# `make harness` renders it into each harness's own files; edit here, never there.

[commands]
allow = [
  "find *",
  "grep *",
  "head *",
  "ls *",
  "make *",
  "mkdir *",
  "rg *",
  "tail *",
  "tree *",
  "wc *",
  "which *",
  "xargs *",
  "gh *",
  "glab *",
  "acli *",
  "pgcli *",
  "sentry *",
  "bru-cli *",
  "ntn *",
  "aws *",
  "gcloud *",
  "gsutil *",
  "bq *",
  "bunx ctx7 *",
  "npx -y ctx7 *",
]
deny = [
  "dd *",
  "diskutil apfs changePassphrase",
  "diskutil apfs decryptVolume",
  "diskutil apfs deleteContainer",
  "diskutil apfs deleteSnapshot",
  "diskutil apfs deleteVolume",
  "diskutil apfs deleteVolumeGroup",
  "diskutil apfs eraseVolume",
  "diskutil appleRAID",
  "diskutil coreStorage",
  "diskutil cs",
  "diskutil disableJournal",
  "diskutil disableOwnership",
  "diskutil eraseDisk",
  "diskutil eraseVolume",
  "diskutil partitionDisk",
  "diskutil randomDisk",
  "diskutil reformat",
  "diskutil resetFusion",
  "diskutil zeroDisk",
  "gh pr merge *",
  "git branch -D *",
  "git checkout .",
  "git checkout -- *",
  "git clean -f *",
  "git clean -fd *",
  "git filter-branch *",
  "git filter-repo *",
  "git push --delete *",
  "git push --force *",
  "git push --force-with-lease *",
  "git push -f *",
  "git push origin main",
  "git push origin master",
  "git reflog expire *",
  "git reset --hard *",
  "git restore .",
  "git restore --worktree *",
  "git stash clear",
  "git stash drop *",
  "git switch --discard-changes *",
  "git update-ref -d *",
  "git worktree remove --force *",
  "git worktree remove -f *",
  "mkfs *",
  "rm -rf *",
  "shred *",
  "sudo *",
  "find / *",
  "find ~ *",
  "find ..",
  "find .. *",
  "lazygit",
  "lazygit *",
  "btop",
  "btop *",
  "dive",
  "dive *",
  "nnn",
  "nnn *",
  "pgcli",
  "pgcli *",
  "lazydocker",
  "lazydocker *",
]

[paths]
deny_read = [
  "~/.ssh/**",
  "~/.gnupg/**",
  "~/.npmrc",
  "~/.config/npm/**",
  "~/.pnpmrc",
  "~/.yarnrc",
  "~/.yarnrc.yml",
  "**/.env",
  "**/.env.local",
  "**/.env.*.local",
  "**/.env.staging",
  "**/.env.production",
  "**/.env.test",
  "**/.env.prod",
  "**/.env.dev",
  "**/.env.development",
  "**/*.pem",
  "**/*.key",
  "**/*-key.json",
  "**/secrets/**",
  "**/*.p12",
  "**/*.pfx",
  "**/*.jks",
  "~/.netrc",
  "**/credentials/**",
  "**/credentials.json",
  "~/.git-credentials",
  "~/.gitconfig",
  "~/.aws/**",
  "~/.config/gcloud/**",
  "~/.config/terraform/**",
  "~/.terraform.d/**",
  "**/.terraform.tfstate*",
  "~/.terraformrc",
  "~/Library/Preferences/.wrangler/**",
  "~/.config/.wrangler/**",
  "~/.docker/config.json",
  "~/.config/Code/User/globalStorage/**",
  "~/.zsh_history",
  "**/service-account*.json",
]
deny_edit = [
  "~/.ssh/**",
  "~/.gnupg/**",
  "~/.npmrc",
  "~/.config/npm/**",
  "~/.pnpmrc",
  "~/.yarnrc",
  "~/.yarnrc.yml",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/yarn.lock",
  "**/.env",
  "**/.env.local",
  "**/.env.*.local",
  "**/.env.staging",
  "**/.env.production",
  "**/.env.test",
  "**/.env.prod",
  "**/.env.dev",
  "**/.env.development",
  "**/*.pem",
  "**/*.key",
  "**/*-key.json",
  "**/secrets/**",
  "**/*.p12",
  "**/*.pfx",
  "**/*.jks",
  "~/.netrc",
  "**/credentials/**",
  "**/credentials.json",
  "~/.git-credentials",
  "~/.gitconfig",
  "~/.aws/**",
  "~/.config/gcloud/**",
  "~/.config/acli/**",
  "~/.config/terraform/**",
  "~/.terraform.d/**",
  "**/.terraform.tfstate*",
  "~/.terraformrc",
  "~/Library/Preferences/.wrangler/**",
  "~/.config/.wrangler/**",
  "~/.docker/config.json",
  "~/.config/Code/User/globalStorage/**",
  "~/.zsh_history",
  "**/service-account*.json",
]
allow_edit = [
  "**/.env.sample",
  "**/.env.example",
]

[tools]
allow = [
  "WebFetch",
  "WebSearch",
]
deny = [
  "Workflow",
  "Artifact",
  "ScheduleWakeup",
  "ReportFindings",
  "ShareOnboardingGuide",
]

[mcp]
deny = [
  "notion",
  "Notion",
  "supabase",
  "Supabase",
]
