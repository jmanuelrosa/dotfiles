# What any agent may run, read and edit, in no harness's spelling.
# `make harness` renders it into each harness's own files; edit here, never there.

[commands]
allow = [
  "find *",
  "grep *",
  "head *",
  "ls *",
  "make *",
  "mkdir *",
  "rg *",
  "tail *",
  "tree *",
  "wc *",
  "which *",
  "xargs *",
  "gh *",
  "glab *",
  "acli *",
  "pgcli *",
  "sentry *",
  "bru-cli *",
  "ntn *",
  "aws *",
  "gcloud *",
  "gsutil *",
  "bq *",
  "bunx ctx7 *",
  "npx -y ctx7 *",
  "kura list *",
  "kura scout *",
  "kura doctor *",
  "kura outdated *",
  "kura add *",
  "kura remove *",
  "kura adopt *",
  "kura restore *",
  "kura converge *",
  "kura sync *",
  "cf auth whoami",
]
deny = [
  "dd *",
  "diskutil apfs changePassphrase",
  "diskutil apfs decryptVolume",
  "diskutil apfs deleteContainer",
  "diskutil apfs deleteSnapshot",
  "diskutil apfs deleteVolume",
  "diskutil apfs deleteVolumeGroup",
  "diskutil apfs eraseVolume",
  "diskutil appleRAID",
  "diskutil coreStorage",
  "diskutil cs",
  "diskutil disableJournal",
  "diskutil disableOwnership",
  "diskutil eraseDisk",
  "diskutil eraseVolume",
  "diskutil partitionDisk",
  "diskutil randomDisk",
  "diskutil reformat",
  "diskutil resetFusion",
  "diskutil zeroDisk",
  "gh pr merge",
  "gh pr merge *",
  # A rule matches the command as written, so `git -C <dir> push --force` slips past
  # `git push --force *`, and `git push origin main --force` slips past both. The `-*`
  # forms cover a global option before the subcommand; the `push|p|up * <force>` forms
  # cover a force flag or a `+` refspec after the remote. The alias spellings (apf, pf,
  # res, rh, and p/up with a force flag) are the ones roles/apps/files/.gitconfig ships.
  # `git -* p|up * <force>` is deliberately absent: two free stars around a word that
  # short deny `git -C x commit -m "wire up the + button"`, with no allow to undo it.
  "git -* apf",
  "git -* apf *",
  "git -* p --force*",
  "git -* p -f",
  "git -* p -f *",
  "git -* pf",
  "git -* pf *",
  "git -* push * +*",
  "git -* push * --force*",
  "git -* push * -f",
  "git -* push * -f *",
  "git -* push --force*",
  "git -* push -f",
  "git -* push -f *",
  "git -* res",
  "git -* res *",
  "git -* reset --hard*",
  "git -* rh",
  "git -* rh *",
  "git -* up --force*",
  "git -* up -f",
  "git -* up -f *",
  "git apf",
  "git apf *",
  "git branch -D *",
  "git checkout .",
  "git checkout -- *",
  "git clean -f",
  "git clean -f *",
  "git clean -fd",
  "git clean -fd *",
  "git filter-branch",
  "git filter-branch *",
  "git filter-repo",
  "git filter-repo *",
  "git p * +*",
  "git p * --force*",
  "git p * -f",
  "git p * -f *",
  "git p --force",
  "git p --force *",
  "git p --force-with-lease",
  "git p --force-with-lease *",
  "git p -f",
  "git p -f *",
  "git pf",
  "git pf *",
  "git push * +*",
  "git push * --force*",
  "git push * -f",
  "git push * -f *",
  "git push --delete *",
  "git push --force",
  "git push --force *",
  "git push --force-with-lease",
  "git push --force-with-lease *",
  "git push -f",
  "git push -f *",
  "git push origin main",
  "git push origin master",
  "git reflog expire",
  "git reflog expire *",
  "git res",
  "git res *",
  "git reset --hard",
  "git reset --hard *",
  "git restore .",
  "git restore --worktree *",
  "git rh",
  "git rh *",
  "git stash clear",
  "git stash drop",
  "git stash drop *",
  "git switch --discard-changes *",
  "git up * +*",
  "git up * --force*",
  "git up * -f",
  "git up * -f *",
  "git up --force",
  "git up --force *",
  "git up --force-with-lease",
  "git up --force-with-lease *",
  "git up -f",
  "git up -f *",
  "git update-ref -d *",
  "git worktree remove --force *",
  "git worktree remove -f *",
  "mkfs *",
  "rm -rf *",
  "shred *",
  "sudo *",
  "find / *",
  "find ~ *",
  "find ..",
  "find .. *",
  "lazygit",
  "lazygit *",
  "btop",
  "btop *",
  "dive",
  "dive *",
  "nnn",
  "nnn *",
  "lazydocker",
  "lazydocker *",
]

[paths]
deny_read = [
  "~/.ssh/**",
  "~/.gnupg/**",
  "~/.npmrc",
  "~/.config/npm/**",
  "~/.pnpmrc",
  "~/.yarnrc",
  "~/.yarnrc.yml",
  "**/.env",
  "**/.env.local",
  "**/.env.*.local",
  "**/.env.staging",
  "**/.env.production",
  "**/.env.test",
  "**/.env.prod",
  "**/.env.dev",
  "**/.env.development",
  "**/*.pem",
  "**/*.key",
  "**/*-key.json",
  "**/secrets/**",
  "**/*.p12",
  "**/*.pfx",
  "**/*.jks",
  "~/.netrc",
  "**/credentials/**",
  "**/credentials.json",
  "~/.git-credentials",
  "~/.gitconfig",
  "~/.aws/**",
  "~/.config/gcloud/**",
  "~/.config/terraform/**",
  "~/.terraform.d/**",
  "**/.terraform.tfstate*",
  "~/.terraformrc",
  "~/Library/Preferences/.wrangler/**",
  "~/.config/.wrangler/**",
  "~/.docker/config.json",
  "~/.config/Code/User/globalStorage/**",
  "~/.zsh_history",
  "**/service-account*.json",
]
deny_edit = [
  "~/.ssh/**",
  "~/.gnupg/**",
  "~/.npmrc",
  "~/.config/npm/**",
  "~/.pnpmrc",
  "~/.yarnrc",
  "~/.yarnrc.yml",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/yarn.lock",
  "**/.env",
  "**/.env.local",
  "**/.env.*.local",
  "**/.env.staging",
  "**/.env.production",
  "**/.env.test",
  "**/.env.prod",
  "**/.env.dev",
  "**/.env.development",
  "**/*.pem",
  "**/*.key",
  "**/*-key.json",
  "**/secrets/**",
  "**/*.p12",
  "**/*.pfx",
  "**/*.jks",
  "~/.netrc",
  "**/credentials/**",
  "**/credentials.json",
  "~/.git-credentials",
  "~/.gitconfig",
  "~/.aws/**",
  "~/.config/gcloud/**",
  "~/.config/acli/**",
  "~/.config/terraform/**",
  "~/.terraform.d/**",
  "**/.terraform.tfstate*",
  "~/.terraformrc",
  "~/Library/Preferences/.wrangler/**",
  "~/.config/.wrangler/**",
  "~/.docker/config.json",
  "~/.config/Code/User/globalStorage/**",
  "~/.zsh_history",
  "**/service-account*.json",
]
allow_edit = [
  "**/.env.sample",
  "**/.env.example",
]

[tools]
allow = [
  "WebFetch",
  "WebSearch",
  "mcp__claude_ai_Slack__slack_read_thread",
  "mcp__claude_ai_Slack__slack_search_public_and_private",
  "mcp__claude_ai_Slack__slack_read_channel",
]
deny = [
  "Workflow",
  "Artifact",
  "ScheduleWakeup",
  "ReportFindings",
  "ShareOnboardingGuide",
]

[mcp]
deny = [
  "notion",
  "Notion",
  "supabase",
  "Supabase",
]
