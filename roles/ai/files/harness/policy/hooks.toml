# Every hook this payload wires, in the order each harness runs them.
#
# The order is Pi's: guardrails runs its gates one after another and stops at the first
# refusal, so the cheap parses come before pre-commit-verify spends a project's lint budget,
# and the rtk rewrite comes after every gate has read the command it was actually given.
# Claude runs the hooks of one event in parallel, so the same order costs it nothing.
#
# `tools` and `event` are neutral names; each emitter spells them for its harness.
# `script` names a file in hooks/, `command` is a shell line run as written.
# `claude_if` is Claude's per-hook permission-rule filter, one entry per rule.
# A `rewrite` hook changes the command instead of refusing it: `exec` is what runs, and
# `requires_env` is the opt-in that must be non-empty for it to run at all.

# Codex is left off the gates that read what it cannot give them: em-dash-gate reads a
# Write/Edit payload where Codex sends an apply_patch one, and the rtk rewrite speaks
# Claude's rewrite output, which Codex has not been checked against. git-skill-gate looks
# for the skill that authorised a commit in a transcript field Codex never writes, so
# Codex runs it with `codex_args` that drop that one check and keep its blocks.
# No claude_if on it or on pre-commit-verify: a `Bash(git *)` filter never sees a git
# spelled `/opt/homebrew/bin/git`, behind `env` or `timeout`, or inside `bash -c`.
[[hook]]
id = "git-skill-gate"
event = "pre_tool"
tools = ["bash"]
script = "git-skill-gate.sh"
codex_args = ["--skip-skill-route"]
harnesses = ["claude", "pi", "codex"]

# Codex refuses this gate's `ask` answer and runs the command anyway, so there only its
# blocks hold. Codex's sandbox has no network, which makes a cloud call ask to leave it.
[[hook]]
id = "cloud-readonly-gate"
event = "pre_tool"
tools = ["bash"]
script = "cloud-readonly-gate.sh"
harnesses = ["claude", "pi", "codex"]

# gh, glab, ntn, bru and acli. No claude_if, like the cloud gate: a call chained after
# `cd` or hidden in a wrapper must still reach it. Pi turns its ask tier into a refusal,
# so there a mutating verb of those five runs from a real terminal; Codex keeps only its blocks.
[[hook]]
id = "cli-egress-gate"
event = "pre_tool"
tools = ["bash"]
script = "cli-egress-gate.sh"
harnesses = ["claude", "pi", "codex"]

# WebFetch and WebSearch are allowlisted and never pass the sandbox's domain allowlist,
# so a URL or query is the egress channel a prompt injection reaches for. Claude only:
# pi has no web tool, and Codex's is hosted, so its adapter pins it to the cache instead.
[[hook]]
id = "web-egress-gate"
event = "pre_tool"
tools = ["web_fetch", "web_search"]
script = "web-egress-gate.sh"
harnesses = ["claude"]

[[hook]]
id = "pre-commit-verify"
event = "pre_tool"
tools = ["bash"]
script = "pre-commit-verify.sh"
timeout = 180
harnesses = ["claude", "pi", "codex"]

[[hook]]
id = "rtk"
event = "pre_tool"
tools = ["bash"]
kind = "rewrite"
exec = ["rtk", "hook", "claude"]
requires_env = "RTK_ENABLE"
env = { RTK_HOOK_AUDIT = "1" }
harnesses = ["claude", "pi"]

[[hook]]
id = "em-dash-gate"
event = "pre_tool"
tools = ["write", "edit"]
script = "em-dash-gate.sh"
harnesses = ["claude", "pi"]

# Pi has no plan mode, so there is nothing to stamp.
[[hook]]
id = "plan-date-stamp"
event = "post_tool"
tools = ["exit_plan_mode"]
script = "plan-date-stamp.sh"
harnesses = ["claude"]

[[hook]]
id = "kura-converge"
event = "session_start"
command = "if [ -f ./kura.json ]; then ~/.local/bin/kura converge --quiet; fi"
timeout = 10
harnesses = ["claude"]

# No harness can hide a skill from the user and still leave it to the model, so a
# dependency-only skill is refused on the prompt instead. Pi runs it from guardrails on
# `input`, which fires before `/skill:` expands. Codex is off until its UserPromptSubmit
# is shown to carry the raw `$skill` mention.
[[hook]]
id = "dependency-skill-gate"
event = "prompt_submit"
script = "dependency-skill-gate.sh"
harnesses = ["claude", "pi"]

# Stop maps onto Pi's turn_end, which guardrails does not listen to yet.
[[hook]]
id = "skill-recap"
event = "stop"
script = "skill-recap.sh"
harnesses = ["claude"]

[[hook]]
id = "context-nudge"
event = "prompt_submit"
script = "context-nudge.sh"
timeout = 10
harnesses = ["claude"]
