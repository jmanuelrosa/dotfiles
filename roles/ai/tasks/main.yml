# --- the harness link table -------------------------------------------------------
#
# HARNESS_LINKS in defaults is the whole inventory of what lands in each harness's home.
# These tasks install it and know nothing about any one harness, so adding a harness is
# a table entry, not a task.

- name: Select the enabled harness link sets
  ansible.builtin.set_fact:
    harness_sets: "{{ (['shared'] + HARNESS_ENABLED) | map('extract', HARNESS_LINKS) | list }}"

# One link per glob match, computed here so the link and prune tasks below read the same
# list. fileglob keeps regular files only, which is what keeps hooks/tests/ unlinked.
- name: Expand the harness link globs
  ansible.builtin.set_fact:
    harness_glob_links: >-
      {%- set out = [] -%}
      {%- for glob in harness_sets | map(attribute='globs') | flatten -%}
      {%- for match in query('fileglob', HARNESS_DIR ~ '/' ~ glob.src ~ '/' ~ glob.pattern) -%}
      {%- set _ = out.append({'src': match, 'dest': glob.dest ~ '/' ~ (match | basename)}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}
    harness_glob_dirs: "{{ harness_sets | map(attribute='globs') | flatten | map(attribute='dest') | unique | list }}"


# The old Pi bridge must be removed before the directory loop can create Kura's
# per-agent native root. Never replace a foreign path or a real non-directory.
- name: Inspect the legacy Pi agent bridge
  ansible.builtin.stat:
    path: "{{ HOME }}/.pi/agent/agents"
    follow: false
  register: pi_agent_bridge
  when: "'pi' in HARNESS_ENABLED"

- name: Refuse an unexpected Pi agent root
  ansible.builtin.assert:
    that:
      - >-
        (pi_agent_bridge.stat.isdir | default(false)) or
        ((pi_agent_bridge.stat.islnk | default(false)) and
         pi_agent_bridge.stat.lnk_target == HARNESS_DIR ~ '/agents')
    fail_msg: "Refusing to replace {{ HOME }}/.pi/agent/agents"
  when:
    - "'pi' in HARNESS_ENABLED"
    - pi_agent_bridge.stat.exists | default(false)

- name: Remove the legacy Pi agent bridge
  ansible.builtin.file:
    path: "{{ HOME }}/.pi/agent/agents"
    state: absent
  when:
    - "'pi' in HARNESS_ENABLED"
    - pi_agent_bridge.stat.islnk | default(false)

- name: Inspect the shared Pi MCP config destination
  ansible.builtin.stat:
    path: "{{ HOME }}/.config/mcp/mcp.json"
    follow: false
  register: pi_shared_mcp_config
  when: "'pi' in HARNESS_ENABLED"

- name: Refuse to replace a foreign Pi MCP config
  ansible.builtin.assert:
    that:
      - >-
        not (pi_shared_mcp_config.stat.exists | default(false)) and
        not (pi_shared_mcp_config.stat.islnk | default(false)) or
        ((pi_shared_mcp_config.stat.islnk | default(false)) and
         pi_shared_mcp_config.stat.lnk_target == HARNESS_DIR ~ '/mcp.json')
    fail_msg: "Refusing to replace {{ HOME }}/.config/mcp/mcp.json"
  when: "'pi' in HARNESS_ENABLED"

- name: Inspect higher-precedence user-global MCP configs
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ HOME }}/.agents/mcp.json"
    - "{{ HOME }}/.agents/mcp/mcp.json"
    - "{{ HOME }}/.pi/agent/mcp.json"
  register: pi_mcp_overrides
  when: "'pi' in HARNESS_ENABLED"

- name: Refuse to replace a user-owned Pi MCP override
  ansible.builtin.assert:
    that:
      - >-
        not (item.stat.exists | default(false)) and
        not (item.stat.islnk | default(false)) or
        ((item.stat.islnk | default(false)) and
         item.stat.lnk_target == HARNESS_DIR ~ '/adapters/pi/mcp.json')
    fail_msg: "Refusing to replace {{ HOME }}/.pi/agent/mcp.json"
  loop: "{{ pi_mcp_overrides.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - "'pi' in HARNESS_ENABLED"
    - item.item == HOME ~ '/.pi/agent/mcp.json'

- name: Refuse shared server names in the Pi-only inventory
  ansible.builtin.assert:
    that:
      - pi_mcp_collisions | length == 0
    fail_msg: "Pi-only MCP inventory repeats shared servers: {{ pi_mcp_collisions | join(', ') }}"
  vars:
    pi_mcp_collisions: >-
      {{ (lookup('file', HARNESS_DIR ~ '/adapters/pi/mcp.json') | from_json).mcpServers.keys() |
         intersect((lookup('file', HARNESS_DIR ~ '/mcp.json') | from_json).mcpServers.keys()) | list }}
  when: "'pi' in HARNESS_ENABLED"

- name: Read user-owned MCP overrides
  ansible.builtin.slurp:
    src: "{{ item.item }}"
  loop: "{{ pi_mcp_overrides.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  register: pi_mcp_override_files
  no_log: true
  when:
    - "'pi' in HARNESS_ENABLED"
    - item.stat.exists | default(false)
    - >-
      not (item.stat.islnk | default(false)) or
      item.stat.lnk_target != HARNESS_DIR ~ '/adapters/pi/mcp.json'

- name: Refuse shared server names shadowed by a global override
  ansible.builtin.assert:
    that:
      - pi_mcp_collisions | length == 0
    fail_msg: "MCP override {{ item.item.item }} defines shared servers: {{ pi_mcp_collisions | join(', ') }}"
  vars:
    pi_mcp_collisions: >-
      {{ ((item.content | b64decode | from_json).mcpServers | default({})).keys() |
         intersect((lookup('file', HARNESS_DIR ~ '/mcp.json') | from_json).mcpServers.keys()) | list }}
  loop: "{{ pi_mcp_override_files.results | default([]) }}"
  loop_control:
    label: "{{ item.item.item }}"
  when:
    - "'pi' in HARNESS_ENABLED"
    - item is not skipped

# Every destination directory up front, because `state: link` does not create parents
# the way `state: directory` does.
- name: Ensure AI config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ harness_sets | map(attribute='dirs') | flatten }}"

- name: Link harness files
  ansible.builtin.file:
    src: "{{ HARNESS_DIR }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ harness_sets | map(attribute='files') | flatten }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Link harness globs
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ harness_glob_links }}"
  loop_control:
    label: "{{ item.dest }}"

# The globs link what the repo ships and prune nothing, so a rule, hook, agent or theme
# deleted here would leave a dangling link on every machine already provisioned. The
# stale set comes off disk rather than from a list of names. Only symlinks pointing into
# this role's files/ are candidates, which also sweeps links left by the layout before
# harness/ and leaves herdr's real hook file, hand-written rules and kura's links alone.
- name: Find the links in the harness glob directories
  ansible.builtin.find:
    paths: "{{ harness_glob_dirs }}"
    file_type: link
  register: harness_dir_links

# find reports no link target, so a stat per link supplies lnk_source.
- name: Inspect the links in the harness glob directories
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop: "{{ harness_dir_links.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: harness_dir_link_stats

- name: Remove harness links the repo no longer ships
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ harness_dir_link_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when:
    - item.item.path not in (harness_glob_links | map(attribute='dest'))
    - item.stat.islnk | default(false)
    - item.stat.lnk_source is match('^' ~ role_path ~ '/files/')

# Legacy Claude links are still valid through the catalog alias, but must be
# handed off before Kura can install its own catalog-backed per-agent links.
- name: Find legacy Claude agent links
  ansible.builtin.find:
    paths: "{{ HOME }}/.claude/agents"
    file_type: link
  register: legacy_claude_agents
  when: "'claude' in HARNESS_ENABLED"

- name: Inspect legacy Claude agent links
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: false
  loop: "{{ legacy_claude_agents.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: legacy_claude_agent_stats

- name: Remove only role-owned Claude agent links
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    state: absent
  loop: "{{ legacy_claude_agent_stats.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when:
    - item.stat.islnk | default(false)
    - item.stat.lnk_target == HARNESS_DIR ~ '/agents/' ~ (item.item.path | basename)

# --- herdr --------------------------------------------------------------------------

# herdr owns both halves of this integration: it writes its own
# hooks/herdr-agent-state.sh (a real file, not a repo symlink, so the prune above never
# touches it) and registers the SessionStart entry that reports agent state back to the
# workspace manager. `integration status` is the gate: it prints `claude: current (v<n>)`
# only when the installed hook matches the version herdr ships, so a herdr upgrade
# reinstalls on the next run. It is read-only, hence check_mode: false.
#
# The pi integration is an extension at ~/.pi/agent/extensions/ rather than a hook, and
# is installed on the same terms from the same status output.
- name: Check the herdr claude integration status
  ansible.builtin.command: herdr integration status
  register: herdr_integration
  changed_when: false
  check_mode: false

- name: Install the herdr claude integration
  ansible.builtin.command: herdr integration install claude
  when: "'claude: current' not in herdr_integration.stdout"
  changed_when: true

- name: Install the herdr pi integration
  ansible.builtin.command: herdr integration install pi
  when: "'pi: current' not in herdr_integration.stdout"
  changed_when: true

# --- scripts and kura ---------------------------------------------------------------

- name: Link AI scripts into the user bin directory
  ansible.builtin.file:
    src: "{{ role_path }}/files/scripts/{{ item }}/{{ item }}"
    dest: "{{ HOME }}/.local/bin/{{ item }}"
    state: link
    force: true
  # One directory per tool, and the executable inside carries the tool's name, so the
  # source is <name>/<name>. src stays absolute: ansible.builtin.file does not resolve
  # it through the role search path the way copy and template do, and a relative one
  # would be read against ~/.local/bin and written as a dangling link that still
  # reports changed.
  loop: "{{ AI_SCRIPTS }}"

# Kura is not in AI_SCRIPTS: the script loop cannot overwrite the pinned release.
- name: Inspect the command left by the old claude-kit link
  ansible.builtin.stat:
    path: "{{ HOME }}/.local/bin/claude-kit"
    follow: false
  register: claude_kit_command

# Only the link this role wrote is ours to remove.
- name: Refuse to remove an unexpected claude-kit symlink
  ansible.builtin.assert:
    that:
      - claude_kit_command.stat.lnk_source == role_path ~ "/files/scripts/claude-kit/claude-kit"
    fail_msg: "Refusing to remove {{ claude_kit_command.stat.lnk_source }} as claude-kit"
  when: claude_kit_command.stat.islnk | default(false)

- name: Remove the legacy claude-kit symlink
  ansible.builtin.file:
    path: "{{ HOME }}/.local/bin/claude-kit"
    state: absent
  when: claude_kit_command.stat.islnk | default(false)

# --- pi -----------------------------------------------------------------------------

# Kura 0.2 and earlier exposed Pi's global skills through Claude's root. Pi reads
# ~/.agents/skills natively now, and keeping this bridge would load every global skill
# twice. Refuse an unexpected occupant rather than deleting user-owned content.
- name: Check for the superseded pi skills link
  ansible.builtin.stat:
    path: "{{ HOME }}/.pi/agent/skills"
    follow: false
  register: pi_superseded_skills_link

- name: Refuse to remove an unexpected pi skills path
  ansible.builtin.assert:
    that:
      - >-
        not pi_superseded_skills_link.stat.exists or
        (pi_superseded_skills_link.stat.islnk | default(false) and
        pi_superseded_skills_link.stat.lnk_source == HOME ~ "/.claude/skills")
    fail_msg: "Refusing to remove user-owned {{ HOME }}/.pi/agent/skills"

- name: Remove the superseded pi skills link
  ansible.builtin.file:
    path: "{{ HOME }}/.pi/agent/skills"
    state: absent
  when: pi_superseded_skills_link.stat.islnk | default(false)

# Pi reads SYSTEM.md as a replacement system prompt; only remove the old role-owned link.
- name: Check for superseded pi system prompt link
  ansible.builtin.stat:
    path: "{{ HOME }}/.pi/agent/SYSTEM.md"
    follow: false
  register: pi_superseded_system_prompt

- name: Remove superseded pi system prompt link
  ansible.builtin.file:
    path: "{{ HOME }}/.pi/agent/SYSTEM.md"
    state: absent
  when:
    - pi_superseded_system_prompt.stat.islnk | default(false)
    - pi_superseded_system_prompt.stat.lnk_target is match('^' ~ HARNESS_DIR ~ '/')

# Renaming an auto-discovered extension leaves the old role-owned link dangling. Remove
# only links so a file written by hand under a superseded name remains the user's.
- name: Check for superseded pi extension links
  ansible.builtin.stat:
    path: "{{ HOME }}/.pi/agent/extensions/{{ item }}"
    follow: false
  loop:
    - activity.ts
    - claude-ui.ts
    - context-continuity.ts
    - cursor-model-policy.ts
    - footer.ts
    - guardrails.ts
    - minion.ts
    - skill-aliases.ts
    - skill-model.ts
    - statusline.ts
    - velocity.ts
  register: pi_superseded_extension_links

- name: Remove superseded pi extension links
  ansible.builtin.file:
    path: "{{ HOME }}/.pi/agent/extensions/{{ item.item }}"
    state: absent
  loop: "{{ pi_superseded_extension_links.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.islnk | default(false)

# Each manifest entry is a directory containing index.ts and its documentation. Pi
# follows the directory link and auto-discovers index.ts; the manifest keeps the
# disabled claude-ui experiment in the source tree without loading it. A manifest rather
# than a HARNESS_LINKS glob, because fileglob matches files and these are directories.
- name: Symlink pi extensions
  ansible.builtin.file:
    src: "{{ HARNESS_DIR }}/adapters/pi/extensions/{{ item }}"
    dest: "{{ HOME }}/.pi/agent/extensions/{{ item }}"
    state: link
    force: true
  loop: "{{ PI_EXTENSIONS }}"
  when: "'pi' in HARNESS_ENABLED"

- name: Merge shared MCP servers into Claude's user config
  ansible.builtin.command:
    argv: "{{ ['uv', 'run', '--no-project', 'python', HARNESS_DIR ~ '/bin/harness-build', 'apply', 'claude'] + (['--check'] if ansible_check_mode else []) }}"
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  register: claude_mcp_apply
  check_mode: false
  changed_when: "'up to date' not in claude_mcp_apply.stdout"
  failed_when: claude_mcp_apply.rc not in ([0, 1] if ansible_check_mode else [0])
  when: "'claude' in HARNESS_ENABLED"

# --- codex ------------------------------------------------------------------------
#
# Codex writes its own config.toml, so the policy is merged into it rather than linked
# over it: only the keys adapters/codex/adapter.toml names are replaced. The rules file
# is copied beside Codex's own, since its loader skips a symlink. uv supplies the
# Python 3.11 the generator needs, as it does for `make harness`.
- name: Merge the harness policy into Codex's config
  ansible.builtin.command:
    argv: "{{ ['uv', 'run', '--no-project', 'python', HARNESS_DIR ~ '/bin/harness-build', 'apply', 'codex'] + (['--check'] if ansible_check_mode else []) }}"
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  register: codex_apply
  check_mode: false
  changed_when: "'up to date' not in codex_apply.stdout"
  failed_when: codex_apply.rc not in ([0, 1] if ansible_check_mode else [0])
  when: "'codex' in HARNESS_ENABLED"
