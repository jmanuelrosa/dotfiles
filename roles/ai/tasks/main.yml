# Ansible role to install and configure AI tools
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
---

- name: Install AI Homebrew packages
  ansible.builtin.include_tasks: "{{ CURRENT_DIR }}/roles/brew/tasks/packages.yml"

- name: Ensure AI support directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ AI_DIRS }}"

- name: Link AI scripts into the user bin directory
  ansible.builtin.file:
    src: "{{ role_path }}/files/scripts/{{ item }}/{{ item }}"
    dest: "{{ HOME }}/.local/bin/{{ item }}"
    state: link
    force: true
  loop: "{{ AI_SCRIPTS }}"

# --- kura ---------------------------------------------------------------------------
#
# Kura owns every global skill and agent link, and the native roots they live in
# (~/.claude/skills, ~/.claude/agents, ~/.agents/skills, ~/.pi/agent/agents), so none
# of those appear in HARNESS_LINKS.

- name: Install the pinned kura release
  ansible.builtin.get_url:
    url: "{{ KURA.repository }}/releases/download/{{ KURA.release }}/kura"
    dest: "{{ HOME }}/.local/bin/kura"
    checksum: "{{ KURA.checksum }}"
    mode: "0755"

- name: Link kura's catalog and machine config
  ansible.builtin.file:
    src: "{{ HARNESS_DIR }}/kura/{{ item }}"
    dest: "{{ HOME }}/.config/kura/{{ item }}"
    state: link
    force: true
  loop:
    - catalog
    - config.json

# `removes` skips the check-mode run on a machine where get_url has not downloaded kura yet.
- name: Sync global skills and agents with kura
  ansible.builtin.command:
    argv: "{{ [HOME ~ '/.local/bin/kura', 'sync'] + (['--dry-run'] if ansible_check_mode else []) }}"
    removes: "{{ HOME }}/.local/bin/kura"
  register: kura_sync
  check_mode: false
  changed_when: "', 0 changes' not in kura_sync.stdout"

# --- harness links ------------------------------------------------------------------

- name: Select the enabled harness link sets
  ansible.builtin.set_fact:
    harness_sets: "{{ (['shared'] + HARNESS_ENABLED) | map('extract', HARNESS_LINKS) | list }}"

# fileglob keeps regular files only, which is what keeps hooks/tests/ unlinked.
- name: Expand the harness link globs
  ansible.builtin.set_fact:
    harness_glob_links: >-
      {%- set out = [] -%}
      {%- for glob in harness_sets | map(attribute='globs') | flatten -%}
      {%- for match in query('fileglob', HARNESS_DIR ~ '/' ~ glob.src ~ '/' ~ glob.pattern) -%}
      {%- set _ = out.append({'src': match, 'dest': glob.dest ~ '/' ~ (match | basename)}) -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ out }}

# `state: link` does not create parents the way `state: directory` does.
- name: Ensure AI config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ harness_sets | map(attribute='dirs') | flatten }}"

- name: Link harness files
  ansible.builtin.file:
    src: "{{ HARNESS_DIR }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ harness_sets | map(attribute='files') | flatten }}"
  loop_control:
    label: "{{ item.dest }}"

- name: Link harness globs
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop: "{{ harness_glob_links }}"
  loop_control:
    label: "{{ item.dest }}"

# A file deleted or renamed in the repo leaves its glob link dangling. With -L, `-type l`
# matches only broken links, and -lname narrows them to the ones this role wrote, so
# herdr's real hook file and anything written by hand stay put.
- name: Remove harness links whose source left the repo
  ansible.builtin.command:
    argv: >-
      {{ ['find', '-L']
         + (harness_sets | map(attribute='globs') | flatten | map(attribute='dest') | unique | list)
         + ['-maxdepth', '1', '-type', 'l', '-lname', role_path ~ '/files/*', '-print', '-exec', 'rm', '{}', ';'] }}
  register: harness_prune
  changed_when: harness_prune.stdout | length > 0

# Pi follows each directory link and auto-discovers its index.ts. A manifest rather than
# a glob, because fileglob matches files and these are directories.
- name: Link pi extensions
  ansible.builtin.file:
    src: "{{ HARNESS_DIR }}/adapters/pi/extensions/{{ item }}"
    dest: "{{ HOME }}/.pi/agent/extensions/{{ item }}"
    state: link
    force: true
  loop: "{{ PI_EXTENSIONS }}"
  when: "'pi' in HARNESS_ENABLED"

# Claude and Codex write their own config files, so the policy and shared MCP servers
# are merged into them rather than linked over them. uv supplies the Python 3.11 the
# generator needs, as it does for `make harness`.
- name: Merge the harness policy into each harness's own config
  ansible.builtin.command:
    argv: "{{ ['uv', 'run', '--no-project', 'python', HARNESS_DIR ~ '/bin/harness-build', 'apply', item] + (['--check'] if ansible_check_mode else []) }}"
  environment:
    PYTHONDONTWRITEBYTECODE: "1"
  loop: "{{ HARNESS_ENABLED | intersect(['claude', 'codex']) }}"
  register: harness_apply
  check_mode: false
  changed_when: "'up to date' not in harness_apply.stdout"
  failed_when: harness_apply.rc not in ([0, 1] if ansible_check_mode else [0])

# --- herdr --------------------------------------------------------------------------
#
# herdr writes its own hook file and settings entry. `integration status` prints
# `<harness>: current` only when the installed integration matches the herdr version,
# so an upgrade reinstalls on the next run.

- name: Check the herdr integration status
  ansible.builtin.command: herdr integration status
  register: herdr_integration
  changed_when: false
  check_mode: false

- name: Install the herdr integrations
  ansible.builtin.command: herdr integration install {{ item }}
  loop: "{{ HARNESS_ENABLED | intersect(['claude', 'pi']) }}"
  when: "(item ~ ': current') not in herdr_integration.stdout"
  changed_when: true
