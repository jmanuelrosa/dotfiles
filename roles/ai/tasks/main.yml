# Ansible role to install and configure AI tools
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
---

- name: Add Homebrew taps for AI tooling
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ BREW_PACKAGES.taps | default([]) }}"

- name: Trust non-official Homebrew taps for AI tooling
  ansible.builtin.command:
    cmd: "{{ lookup('pipe', 'which brew') }} trust {{ item }}"
  loop: "{{ BREW_PACKAGES.trusted | default([]) }}"
  register: brew_trust
  changed_when: brew_trust.stdout is search('^Trusted ')

- name: Install AI formulas
  community.general.homebrew:
    name: "{{ BREW_PACKAGES.formulas | default([]) }}"
    state: present
  when: BREW_PACKAGES.formulas | default([]) | length > 0

- name: Install AI casks
  community.general.homebrew_cask:
    name: "{{ BREW_PACKAGES.casks | default([]) }}"
    state: present
  when: BREW_PACKAGES.casks | default([]) | length > 0

# Install the agent-capable release before handing off any native agent paths.
- name: Ensure AI support directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ AI_DIRS }}"

- name: Install the pinned kura release
  ansible.builtin.get_url:
    url: "{{ KURA.repository }}/releases/download/{{ KURA.release }}/kura"
    dest: "{{ HOME }}/.local/bin/kura"
    checksum: "{{ KURA.checksum }}"
    mode: "0755"

# Kura reads only ~/.config/kura/catalog for standalone skills and agents and
# their registries; seat plugins remain outside its managed catalog.
- name: Link the artifact catalog at the fixed path
  ansible.builtin.file:
    src: "{{ HARNESS_DIR }}/kura/catalog"
    dest: "{{ HOME }}/.config/kura/catalog"
    state: link
    force: true

# Kura requires machine configuration before sync or convergence. Codex and opencode
# are not kura harnesses: they read ~/.agents/skills, which the pi harness writes.
# Replace the previously role-written copy with a link so edits to the checkout take
# effect without another playbook run.
- name: Link kura machine config
  ansible.builtin.file:
    src: "{{ HARNESS_DIR }}/kura/config.json"
    dest: "{{ HOME }}/.config/kura/config.json"
    state: link
    force: true

