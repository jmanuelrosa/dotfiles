# Ansible role to install and configure AI tools
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
---

- name: Add Homebrew taps for AI tooling
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ BREW_PACKAGES.taps | default([]) }}"

- name: Trust non-official Homebrew taps for AI tooling
  ansible.builtin.command:
    cmd: "{{ lookup('pipe', 'which brew') }} trust {{ item }}"
  loop: "{{ BREW_PACKAGES.trusted | default([]) }}"
  register: brew_trust
  changed_when: brew_trust.stdout is search('^Trusted ')

- name: Install AI formulas
  community.general.homebrew:
    name: "{{ BREW_PACKAGES.formulas | default([]) }}"
    state: present
  when: BREW_PACKAGES.formulas | default([]) | length > 0

- name: Install AI casks
  community.general.homebrew_cask:
    name: "{{ BREW_PACKAGES.casks | default([]) }}"
    state: present
  when: BREW_PACKAGES.casks | default([]) | length > 0

# Every destination directory up front, because `state: link` does not create
# parents the way `state: directory` does. ~/.claude in particular was only
# ever created as a side effect of making ~/.claude/hooks, one task too late.
- name: Ensure AI config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ HOME }}/.gemini"
    - "{{ HOME }}/.claude"
    - "{{ HOME }}/.claude/hooks"
    - "{{ HOME }}/.claude/skills"
    - "{{ HOME }}/.claude/agents"
    - "{{ HOME }}/.local/bin"
    - "{{ HOME }}/.pi/agent"
    - "{{ HOME }}/Library/Application Support/rtk"

- name: Symlink gemini config
  ansible.builtin.file:
    src: "{{ role_path }}/files/gemini/settings.json"
    dest: "{{ HOME }}/.gemini/settings.json"
    state: link
    force: true

# Listed rather than globbed: files/claude/ also holds README.md and the two
# registries, which are repo data and must not appear in ~/.claude.
- name: Symlink claude config files
  ansible.builtin.file:
    src: "{{ role_path }}/files/claude/{{ item }}"
    dest: "{{ HOME }}/.claude/{{ item }}"
    state: link
    force: true
  loop:
    - settings.json
    - CLAUDE.md
    - statusline.sh

# Globbed because every hook in the directory is meant to be active, so adding
# one should not also mean editing this file.
- name: Symlink claude hooks
  ansible.builtin.file:
    src: "{{ role_path }}/files/claude/hooks/{{ item | basename }}"
    dest: "{{ HOME }}/.claude/hooks/{{ item | basename }}"
    state: link
    force: true
  with_fileglob:
    - "{{ role_path }}/files/claude/hooks/*"

- name: Link AI scripts into the user bin directory
  ansible.builtin.file:
    src: "{{ role_path }}/files/scripts/{{ item | basename }}"
    dest: "{{ HOME }}/.local/bin/{{ item | basename }}"
    state: link
    force: true
  # Documentation lives beside the scripts it documents, so skip .md: the glob would
  # otherwise put a README on PATH. The claude_kit package next to the shim needs no
  # guard because fileglob filters its matches through os.path.isfile, so a directory
  # is never a candidate.
  when: not (item | basename).endswith('.md')
  with_fileglob:
    - "{{ role_path }}/files/scripts/*"

# The `global` group tag in the two registries is the single source of truth for what
# belongs in ~/.claude, and claude-kit already derives that set to answer "does this
# need --global?". This task is the only consumer of it here, deliberately: the same
# derivation once lived in this file as ~130 lines of Jinja, which nothing could
# unit-test and which drifted from the tool's copy the moment either changed.
#
# It converges rather than adds, so a skill that loses its `global` tag is unlinked on
# the next run. Only symlinks pointing into files/claude/ are candidates, so a
# hand-made directory in ~/.claude/skills survives untouched.
- name: Converge global claude skills, agents and plugins
  ansible.builtin.command:
    cmd: "{{ role_path }}/files/scripts/claude-kit sync{{ ' --dry-run' if ansible_check_mode else '' }}"
  environment:
    # Both of claude-kit's environmental inputs, pinned rather than inherited: the
    # playbook's HOME is the right one, and DOTFILES_DIR keeps the tool reading this
    # checkout instead of walking up from wherever the symlink on PATH resolved to.
    HOME: "{{ HOME }}"
    DOTFILES_DIR: "{{ role_path | dirname | dirname }}"
    NO_COLOR: "1"
  register: claude_kit_sync
  # A dry run is the whole task under --check, so it must not be skipped there.
  check_mode: false
  changed_when: claude_kit_sync.stdout is not search(', 0 changes')

# Worth seeing: this is the one task that deletes something nobody named, and its
# report is the only place a prune or a missing artifact is explained.
- name: Show what the global sync did
  ansible.builtin.debug:
    var: claude_kit_sync.stdout_lines
  when: claude_kit_sync is changed or claude_kit_sync.stderr | length > 0

- name: Symlink pi agent config
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "{{ HOME }}/.pi/agent/{{ item | basename }}"
    state: link
    force: true
  loop:
    - pi/settings.json
    - pi/models.json
    - pi/SYSTEM.md
    # Pi reads Claude's skills directly rather than keeping a second copy.
    - claude/skills

# rtk ignores XDG_CONFIG_HOME and only reads the macOS Application Support path.
- name: Symlink rtk config
  ansible.builtin.file:
    src: "{{ role_path }}/files/rtk/config.toml"
    dest: "{{ HOME }}/Library/Application Support/rtk/config.toml"
    state: link
    force: true
