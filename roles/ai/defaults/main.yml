# Ansible defaults for the ai role
# Author: Jose Manuel Rosa <jmanuelrosa@duck.com> (https://jmanuelrosa.dev)
---

# There is no var for the set symlinked into ~/.claude (the artifacts available in
# every project without a per-project `add`). `claude-kit sync` derives it from the
# `global` group tag in skill-registry.json, agent-registry.json and the plugin
# manifests, which is the single source of truth, then expands the skills by their
# declared dependencies. Tag an entry `"global"` to add it to the set. The role runs
# that command in tasks/main.yml and holds no copy of the rule.

BREW_PACKAGES:
  taps:
    - steipete/tap
  trusted:
    - steipete/tap
  formulas:
    - gemini-cli
    - pi-coding-agent
    - rtk
    # Runs the bundled Claude skill validators (e.g. skill-writer's
    # `uv run quick_validate.py`), which declare inline script dependencies.
    - uv
  casks:
    - chatgpt
    - claude
    - claude-code@latest
    - cursor
    - steipete/tap/codexbar

# Tools symlinked onto PATH from files/scripts/, named rather than globbed.
#
# Each entry is a directory holding everything that tool owns, and the executable
# inside it carries the same name: files/scripts/<name>/<name>. That convention is
# what makes the link task a one-line loop.
#
# A glob cannot express this. Ansible's fileglob lookup filters its matches through
# os.path.isfile, so now that every entry here is a directory it would match nothing
# at all and silently install no tools. Naming them also drops the `when` guard that
# used to keep the README off PATH, and gates per tool instead of per role.
AI_SCRIPTS:
  - claude-kit
  - tokencost
