# Overrides applied when `profile=personal` (default).
# Loaded explicitly by dotfiles.yml's pre_tasks based on the active profile,
# not by Ansible's host_vars auto-loading (the inventory hostname is
# `localhost`, not the profile name).
---

# Overrides anything defined in group_vars/all.yml or in role defaults.

# Phone access to herdr through the Cloudflare Tunnel; see roles/apps/README.md.
OVIS_ENABLED: true
OVIS_HERDR_SESSION: work
