[defaults]
# (path) File to which Ansible will log on the controller. When empty logging is disabled.
log_path = ./ansible.log
display_skipped_hosts = False
# Long-running tasks (brew update, brew bundle) can outlast the default 10s
# connection timeout. This governs the connection plugin only; the wait for sudo
# to authenticate is a separate budget and lives in inventory.yml, because
# ansible-core exposes it as a var on the local connection plugin and nowhere here.
timeout = 60
